name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: kzktdk
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: kzktdk.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: kzktdk
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: kzktdk
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix Binary & Assets (.tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          DIST_NAME="kzktdk-${{ matrix.target }}"
          mkdir -p "${DIST_NAME}/models" "${DIST_NAME}/fonts"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${DIST_NAME}/"
          cp models/kzkt.dat "${DIST_NAME}/models/" || true
          cp fonts/* "${DIST_NAME}/fonts/" || true
          cp README.md LICENSE "${DIST_NAME}/" || true
          tar -czvf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
          echo "ARCHIVE_PATH=${DIST_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Package Windows Binary & Assets (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $DistName = "kzktdk-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$DistName\models", "$DistName\fonts" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin_name }}" "$DistName\"
          if (Test-Path "models\kzkt.dat") { Copy-Item "models\kzkt.dat" "$DistName\models\" }
          if (Test-Path "fonts") { Copy-Item "fonts\*" "$DistName\fonts\" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$DistName\" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$DistName\" }
          Compress-Archive -Path "$DistName" -DestinationPath "${DistName}.zip" -Force
          echo "ARCHIVE_PATH=${DistName}.zip" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
